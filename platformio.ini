; PlatformIO Project Configuration File
; =============================================================================
;  RC CAR — RECEIVER
;  Desteklenen platformlar: ESP8266, ESP32
;  Desteklenen input kaynakları: ESP-NOW, Android UDP, PS3, PS4
; =============================================================================

[platformio]
; nodemcuv2 / esp32_espnow / esp32_ps3 / esp32_ps4
default_envs = esp32_espnow

; =============================================================================
;  Ortak ayarlar (tüm env'ler bu bölümü miras alır)
; =============================================================================
[env_base]
monitor_speed = 115200
port = com3;
lib_deps =
    bblanchon/ArduinoJson

; =============================================================================
;  ESP8266 — NodeMCU v3
;  INPUT_ESPNOW (1) veya INPUT_ANDROID (2) desteklenir.
;  PS3/PS4 ESP8266'da desteklenmez.
; =============================================================================
[env:nodemcuv2]
platform  = espressif8266
board     = nodemcuv2
framework = arduino
upload_port   = ${env_base.port}
monitor_port  = ${env_base.port}
monitor_speed = ${env_base.monitor_speed}
lib_deps =
    ${env_base.lib_deps}
; BOARD_TYPE=1 → ESP8266
; RX_INPUT_SOURCE: config.h'den veya buradan override edilebilir
build_flags = -DBOARD_TYPE=1

; =============================================================================
;  ESP32 — ESP-NOW veya Android UDP modu
;  RX_INPUT_SOURCE=1 (ESPNOW) veya 2 (ANDROID)
; =============================================================================
[env:esp32_espnow]
platform  = espressif32
board     = esp32dev
framework = arduino
upload_port   = ${env_base.port}
monitor_port  = ${env_base.port}
monitor_speed = ${env_base.monitor_speed}
lib_deps =
    ${env_base.lib_deps}
    madhephaestus/ESP32Servo
; BOARD_TYPE=2 → ESP32 | RX_INPUT_SOURCE=1 → INPUT_ESPNOW
build_flags = -DBOARD_TYPE=2 ;-DRX_INPUT_SOURCE=1

; =============================================================================
;  ESP32 — PS3 modu
;  Kütüphane: https://github.com/jvpernis/esp32-ps3
;  config.h'de PS_BT_MAC tanımlayın.
;  Kontrolcü bağlantısı: PS butonu
; =============================================================================
[env:esp32_ps3]
platform  = espressif32
board     = esp32dev
framework = arduino
upload_port   = ${env_base.port}
monitor_port  = ${env_base.port}
monitor_speed = ${env_base.monitor_speed}
lib_deps =
    ${env_base.lib_deps}
    madhephaestus/ESP32Servo
    jvpernis/PS3 Controller Host @ ^1.1.0
; BOARD_TYPE=2 → ESP32 | RX_INPUT_SOURCE=3 → INPUT_PS3
build_flags = -DBOARD_TYPE=2 ;-DRX_INPUT_SOURCE=3

; =============================================================================
;  ESP32 — PS4 modu
;  Kütüphane: https://github.com/pablomarquez76/PS4_Controller_Host
;  config.h'de PS_BT_MAC gerekirse ayarlayın.
;  Kontrolcü bağlantısı: Share + PS butonları aynı anda
; =============================================================================
[env:esp32_ps4]
platform  = espressif32
board     = esp32dev
framework = arduino
upload_port   = ${env_base.port}
monitor_port  = ${env_base.port}
monitor_speed = ${env_base.monitor_speed}
lib_deps =
    ${env_base.lib_deps}
    madhephaestus/ESP32Servo
    pablomarquez76/PS4_Controller_Host @ ^1.1.1
; BOARD_TYPE=2 → ESP32 | RX_INPUT_SOURCE=4 → INPUT_PS4
build_flags = -DBOARD_TYPE=2 ;-DRX_INPUT_SOURCE=4
